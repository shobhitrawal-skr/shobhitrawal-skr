<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 45" width="320" height="45">
  <defs>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bc8cff" />
      <stop offset="60%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#56d4dd" />
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bc8cff" />
      <stop offset="50%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    .icon {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      fill: #56d4dd;
      filter: url(#glow);
    }
    .text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 18px;
      fill: url(#text-grad);
      letter-spacing: 1px;
    }
    .underline {
      fill: none;
      stroke: url(#line-grad);
      stroke-width: 2;
    }
  </style>
  <text x="10" y="28" class="icon">👤</text>
  <text x="32" y="28" class="text">ABOUT ME</text>
  <path d="M 10 38 L 300 38" class="underline" />
</svg>
